name: CI

# Version handling as in action-group-executer: package.json stays at 99.99.99. Every run
# builds one .vsix (99.99.99, or x.y.z for a tag release/x.y.z), tests it and keeps it as the
# run's artifact; the publish jobs release exactly that file:
# - push to main: replaces the pre-release "Development Build" (tag `dev`);
# - tag release/x.y.z: a GitHub release, notes from the `## [x.y.z]` section of CHANGELOG.md.
on:
  push:
    branches: ['**']
    tags: ['release/*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Linux runners have no D-Bus session; VS Code (Electron) logs errors without one, so the
# VS Code tests run inside `dbus-run-session` (and `xvfb-run` for a virtual display).

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix: ${{ steps.version.outputs.vsix }}
    steps:
      # actions/checkout runs `git init`; without a default branch name git prints a long hint.
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Before the tests, so they run against the version that gets released.
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/release/* ]]; then
            version="${GITHUB_REF#refs/tags/release/}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '${GITHUB_REF#refs/tags/}' does not match release/x.y.z"
              exit 1
            fi
          else
            version="99.99.99"
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=leuchtturm-updater-$version.vsix" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Integration tests (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: UI test (source editor, Linux only)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run test:ui
      # Also checks that the README images will show on the extension page.
      - name: Package
        run: |
          npx vsce package -o "${{ steps.version.outputs.vsix }}"
          npx tsc -p . && node out/test/checkPackage.js "${{ steps.version.outputs.vsix }}"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: ${{ steps.version.outputs.vsix }}
      # On failure: Leuchtturm's log from the integration tests, the UI test's screenshot.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-failures-${{ matrix.os }}
          path: .test-failures/
          include-hidden-files: true
          if-no-files-found: ignore

  # Leuchtturm in a real Dev Containers window (Docker is preinstalled on Ubuntu runners).
  remote:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: dbus-run-session -- xvfb-run -a npm run test:remote

  # Leuchtturm against a real Jenkins in Docker (builds the image with the Pipeline plugins).
  jenkins:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: dbus-run-session -- xvfb-run -a npm run test:jenkins

  dev-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, remote, jenkins]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Replace development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev "${{ needs.build.outputs.vsix }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Development Build" \
            --notes "Automated build of \`main\` at ${GITHUB_SHA::7}. Version \`99.99.99\`; replaced on every push to \`main\`."

  release:
    if: startsWith(github.ref, 'refs/tags/release/')
    needs: [build, remote, jenkins]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            /^## \[/ { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::No CHANGELOG section found for $VERSION"
            echo "Release $VERSION" > notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" "${{ needs.build.outputs.vsix }}" \
            --verify-tag \
            --latest \
            --title "${{ needs.build.outputs.version }}" \
            --notes-file notes.md
