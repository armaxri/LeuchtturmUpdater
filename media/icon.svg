<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1F3D"/>
      <stop offset="1" stop-color="#16396B"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD84D" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFD84D" stop-opacity="0.6"/>
    </linearGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <!-- beam: wedge from lantern towards upper right -->
    <path d="M100 96 L256 -8 L256 118 Z" fill="url(#beam)"/>
    <!-- up arrow inside the beam -->
    <path d="M196 44 L224 76 L207 76 L207 104 L185 104 L185 76 L168 76 Z" fill="#0A1F3D"/>
    <!-- sea -->
    <path d="M0 214 Q32 202 64 214 T128 214 T192 214 T256 214 V256 H0 Z" fill="#1F5FA8"/>
    <path d="M0 230 Q32 220 64 230 T128 230 T192 230 T256 230 V256 H0 Z" fill="#2B78CC"/>
    <!-- rock -->
    <path d="M44 218 Q60 196 96 198 Q132 196 148 218 Z" fill="#0F2747"/>
    <!-- tower -->
    <clipPath id="tower"><path d="M78 118 L114 118 L124 206 L68 206 Z"/></clipPath>
    <g clip-path="url(#tower)">
      <rect x="60" y="110" width="72" height="100" fill="#F5F5F0"/>
      <rect x="60" y="136" width="72" height="18" fill="#E63946"/>
      <rect x="60" y="172" width="72" height="18" fill="#E63946"/>
    </g>
    <!-- gallery -->
    <rect x="70" y="110" width="52" height="9" rx="2" fill="#0F2747"/>
    <!-- lantern -->
    <rect x="82" y="84" width="28" height="26" rx="3" fill="#FFD84D"/>
    <rect x="94" y="84" width="4" height="26" fill="#E8B400"/>
    <!-- roof -->
    <path d="M76 86 L96 64 L116 86 Z" fill="#E63946"/>
    <circle cx="96" cy="62" r="4" fill="#0F2747"/>
    <!-- door -->
    <rect x="90" y="190" width="12" height="16" rx="6" fill="#0F2747"/>
  </g>
</svg>
